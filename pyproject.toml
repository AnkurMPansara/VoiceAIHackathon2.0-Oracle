[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "best-time-to-call"
version = "0.1.0"
description = "IndiaMART outbound calling intelligence: best time to call and dynamic retry engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "uvicorn>=0.24.0,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "psutil>=5.9.0,<7.0.0",
    "redis>=5.0.0,<6.0.0",
]

[project.scripts]
btc = "btc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
include = ["btc*"]
